[project]
name = "vet-agent"
version = "0.1.0"
description = "Agentic RAG assistant over Plumb's Veterinary Drug Handbook"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=4.2",
    "typer>=0.12",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=5.6.0",
    "qdrant-client>=1.18.0",
    "numpy>=2.5.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.68",
]

[project.scripts]
vet-agent = "vet_agent.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "anthropic>=0.114.0",
    "types-pyyaml>=6.0.12.20260518",
    "types-tqdm>=4.68",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vet_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["vet_agent"]
strict = true

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: needs a model download or network; deselected by default (run with -m slow)",
]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true
